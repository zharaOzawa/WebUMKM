<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login - Desa Panggungharjo</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
    body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
    }
    .login-card {
        background: white;
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        width: 100%;
        max-width: 400px;
        text-align: center;
    }
    .login-card h2 {
        color: var(--text-main);
        margin-bottom: 8px;
    }
    .login-card p {
        color: var(--text-muted);
        margin-bottom: 30px;
    }
    .field {
        text-align: left;
        margin-bottom: 20px;
    }
    .field label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        font-size: 0.9rem;
    }
    .field input {
        width: 100%;
        padding: 12px 16px;
        border: 1px solid rgba(0,0,0,0.1);
        border-radius: 8px;
        font-family: inherit;
        font-size: 1rem;
    }
    .error-msg {
        color: #e74c3c;
        font-size: 0.9rem;
        margin-top: -10px;
        margin-bottom: 20px;
        display: none;
    }
    .btn-login {
        width: 100%;
        justify-content: center;
        padding: 14px;
        font-size: 1rem;
        background: var(--gold);
        color: white;
        border: none;
        border-radius: 8px;
        font-weight: 700;
        cursor: pointer;
        transition: 0.2s;
    }
    .btn-login:hover {
        background: #cf952a;
    }
</style>
</head>
<body class="pattern-dark">

<div class="login-card">
    <div class="logo" style="justify-content: center; margin-bottom: 20px;">
      <span class="logo-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z"/></svg>
      </span>
    </div>
    <h2>Admin Portal</h2>
    <p>Silakan masuk untuk mengelola konten</p>

    <form id="loginForm">
        <div class="field">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Masukkan username" required>
        </div>
        <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Masukkan password" required>
        </div>
        <div class="error-msg" id="errorMsg">Username atau password salah!</div>
        <button type="submit" class="btn-login">Masuk ke Dashboard</button>
    </form>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const u = document.getElementById('username').value;
    const p = document.getElementById('password').value;
    const err = document.getElementById('errorMsg');
    
    try {
        const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: u, password: p })
        });
        
        if (res.ok) {
            window.location.href = '/dashboard.html';
        } else {
            err.style.display = 'block';
        }
    } catch (error) {
        err.textContent = 'Terjadi kesalahan koneksi.';
        err.style.display = 'block';
    }
});
</script>
</body>
</html>
